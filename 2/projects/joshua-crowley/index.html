      <script type="module">
      
      //ripped from https://github.com/MaxwellBo/html-in-hyde/blob/master/2/invitation.html

    // upload and colour picker settings
    const BYTES_PER_KIB = 1024;
    const MAX_IMAGE_KIB = 512;
    const MAX_IMAGE_BYTES = MAX_IMAGE_KIB * BYTES_PER_KIB;
    const IMAGE_PREVIEW_SIZE = 16;
    const RENDER_SCENE_IMAGES = true;
    const RENDER_KITE_ROPES = true;
    const FILE_SIZE_DECIMAL_PLACES = 2;
    const COLOR_CHANNEL_VALUES = 256;
    const COLOR_CHANNEL_COUNT = 3;
    const MINIMUM_COLOR_AVERAGE = 100;
    const HEX_RADIX = 16;
    const HEX_CHANNEL_WIDTH = 2;

    // positions in the unscaled 1000 by 560 scene
    const WORLD_WIDTH = 1000;
    const MAX_SCENE_SCALE = 0.64;
    const GRASS_LEFT_X = 150;
    const GRASS_WIDTH = 700;
    const GRASS_HORIZONTAL_EDGE_MARGIN = 0.1;
    const GRASS_DEPTH_EDGE_MARGIN = 0.05;
    const FLIER_MIN_X =
      GRASS_LEFT_X + GRASS_WIDTH * GRASS_HORIZONTAL_EDGE_MARGIN;
    const FLIER_MAX_X =
      GRASS_LEFT_X + GRASS_WIDTH * (1 - GRASS_HORIZONTAL_EDGE_MARGIN);
    const FLIER_MIN_GRASS_PROGRESS = GRASS_DEPTH_EDGE_MARGIN;
    const FLIER_MAX_GRASS_PROGRESS = 1 - GRASS_DEPTH_EDGE_MARGIN;
    const FLIER_OFFSET_X = 29;
    const FLIER_OFFSET_Y = 18;
    const FLIER_FEET_OFFSET_Y = 90;
    const GRASS_BACK_Y = 350;
    const GRASS_LENGTH = 340;

    // kite geometry and the starting pose for each new flier
    const ROPE_LENGTH = 245;
    const INITIAL_KITE_HEIGHT = 175;
    const INITIAL_KITE_HEIGHT_STEP = 15;
    const INITIAL_KITE_HEIGHT_VARIANTS = 3;
    const LEFT_HAND_OFFSET_X = -18.06;
    const LEFT_HAND_OFFSET_Y = 56.42;
    const RIGHT_HAND_OFFSET_X = 21.28;
    const RIGHT_HAND_OFFSET_Y = 53.67;
    const KITE_ROTATION_OFFSET_DEGREES = 45;
    const KITE_PHASE_STEP = 1.71;
    const KITE_HALF_SIZE = 22;
    const ROPE_LAYER_PADDING = 64;
    const ROPE_LAYER_WIDTH = ROPE_LENGTH + ROPE_LAYER_PADDING * 2;
    const ROPE_LAYER_HEIGHT = ROPE_LAYER_PADDING * 2;

    // wind changes gradually, with occasional calm periods and gusts
    const INITIAL_WIND_SPEED = 120;
    const INITIAL_WIND_CHANGE_DELAY_MS = 3000;
    const CALM_WIND_CHANCE = 0.1;
    const MINIMUM_WIND_STRENGTH = 95;
    const WIND_STRENGTH_RANGE = 65;
    const WIND_DIRECTION_CHANGE_CHANCE = 0.15;
    const MINIMUM_WIND_CHANGE_DELAY_MS = 4000;
    const WIND_CHANGE_DELAY_RANGE_MS = 3000;
    const WIND_SMOOTHING = 0.65;
    const GUST_PERIOD_MS = 700;
    const GUST_AMPLITUDE = 18;

    // forces, integration limits, and collision boundaries
    const GRAVITY = 140;
    const MAX_LIFT = 220;
    const LIFT_COEFFICIENT = 0.03;
    const DRAG_COEFFICIENT = 0.005;
    const TAKEOFF_CLEARANCE = 2;
    const TAKEOFF_VELOCITY_FACTOR = 0.08;
    const TAKEOFF_VELOCITY_Y = -18;
    const VELOCITY_DAMPING = 0.996;
    const MILLISECONDS_PER_SECOND = 1000;
    const TARGET_FRAME_RATE = 30;
    const FRAME_INTERVAL_MS = MILLISECONDS_PER_SECOND / TARGET_FRAME_RATE;
    const NOMINAL_FPS = 60;
    const MAX_DELTA_SECONDS = 1 / TARGET_FRAME_RATE;
    const ROPE_EPSILON = 0.001;
    const ROPE_SLACK_OFFSET = 4;
    const ROPE_SLACK_FACTOR = 0.45;
    const RADIANS_TO_DEGREES = 180 / Math.PI;

  const scene = document.getElementById("scene");
  const world = document.getElementById("world");
  const windReadout = document.getElementById("wind-readout");

  const updateSceneScale = () => {
    world.style.setProperty("--scene-scale",
      Math.min(MAX_SCENE_SCALE, scene.clientWidth / WORLD_WIDTH));
  };
  updateSceneScale();
  new ResizeObserver(updateSceneScale).observe(scene);

  const group = document.querySelector(".kite-person");
  const person = {
    kite: group.querySelector(".kite"),
    rope: group.querySelector(".kite-rope"),
    ropeLayer: group.querySelector(".kite-rope-layer"),
    personX: 293.275,
    personY: 260,
    ropeLength: ROPE_LENGTH,
    x: 500, y: 250, vx: 14.91, vy: -24.28,
    handSide: 1, phase: 0,
    landedY: GRASS_BACK_Y - KITE_HALF_SIZE,
    landed: false
  };
  
  const kitePeople = [person];

      let wind = INITIAL_WIND_SPEED;
      let targetWind = wind;
      let windDirection = Math.sign(wind);
      let nextWindChange = performance.now() + INITIAL_WIND_CHANGE_DELAY_MS;
      let lastTime = performance.now();

      // choose a new target and ease toward it instead of changing instantly.
      const chooseNewWind = () => {
        // occasionally choose still air so the kites have a chance to land.
        if (Math.random() < CALM_WIND_CHANCE) {
          targetWind = 0;
        } else {
          const strength = MINIMUM_WIND_STRENGTH + Math.random() * WIND_STRENGTH_RANGE;
          if (Math.random() < WIND_DIRECTION_CHANGE_CHANCE) {
            windDirection *= -1;
          }
          targetWind = windDirection * strength;
        }
        nextWindChange =
          performance.now() +
          MINIMUM_WIND_CHANGE_DELAY_MS +
          Math.random() * WIND_CHANGE_DELAY_RANGE_MS;
      };

      // advance the kite simulation once per animation frame.
      const draw = (now) => {

        requestAnimationFrame(draw);
        const elapsed = now - lastTime;
        if (elapsed < FRAME_INTERVAL_MS) return;

        const delta = Math.min(
          MAX_DELTA_SECONDS,
          elapsed / MILLISECONDS_PER_SECOND
        );
        lastTime = now - (elapsed % FRAME_INTERVAL_MS);

        // change the wind on schedule.
        if (now > nextWindChange) {
          chooseNewWind();
        }
        wind += (targetWind - wind) * Math.min(1, delta * WIND_SMOOTHING);
        windReadout.textContent = `wind ${wind < 0 ? "←" : "→"} ${Math.round(Math.abs(wind))}`;

        kitePeople.forEach((person) => {
          const handX =
            person.personX +
            (person.handSide < 0
              ? LEFT_HAND_OFFSET_X
              : RIGHT_HAND_OFFSET_X);
          const handY =
            person.personY +
            (person.handSide < 0
              ? LEFT_HAND_OFFSET_Y
              : RIGHT_HAND_OFFSET_Y);
          const gust =
            Math.sin(now / GUST_PERIOD_MS + person.phase) * GUST_AMPLITUDE;

          const takeoffLift = Math.min(
            MAX_LIFT,
            LIFT_COEFFICIENT * Math.abs(wind + gust) ** 2
          );

          // release a landed kite when lift exceeds gravity.
          if (person.landed && takeoffLift > GRAVITY) {
            person.landed = false;
            person.y = person.landedY - TAKEOFF_CLEARANCE;
            person.vx = wind * TAKEOFF_VELOCITY_FACTOR;
            person.vy = TAKEOFF_VELOCITY_Y;
          }

          // only airborne kites need forces, velocity, and position integrated.
          if (!person.landed) {
            const airX = wind + gust - person.vx;
            const airY = -person.vy;
            const airSpeed = Math.hypot(airX, airY);
            const dragX = DRAG_COEFFICIENT * airSpeed * airX;
            const dragY = DRAG_COEFFICIENT * airSpeed * airY;
            const liftForce = -Math.min(
              MAX_LIFT,
              LIFT_COEFFICIENT * Math.abs(airX) * airSpeed
            );
            const forceY = GRAVITY + dragY + liftForce;

            person.vx += dragX * delta;
            person.vy += forceY * delta;
            person.vx *= Math.pow(VELOCITY_DAMPING, delta * NOMINAL_FPS);
            person.vy *= Math.pow(VELOCITY_DAMPING, delta * NOMINAL_FPS);
            person.x += person.vx * delta;
            person.y += person.vy * delta;

            const ropeX = person.x - handX;
            const ropeY = person.y - handY;
            const ropeDistance = Math.max(ROPE_EPSILON, Math.hypot(ropeX, ropeY));
            const normalX = ropeX / ropeDistance;
            const normalY = ropeY / ropeDistance;

            // keep the kite inside the rope's radius and remove outward speed.
            if (ropeDistance > person.ropeLength) {
              person.x = handX + normalX * person.ropeLength;
              person.y = handY + normalY * person.ropeLength;

              const radialVelocity = person.vx * normalX + person.vy * normalY;

              // remove velocity moving away from the hand so the rope cannot stretch.
              if (radialVelocity > 0) {
                person.vx -= radialVelocity * normalX;
                person.vy -= radialVelocity * normalY;
              }
            }

            // stop the kite at the grass until the wind produces enough lift.
            if (person.y >= person.landedY) {
              person.y = person.landedY;
              person.vx = 0;
              person.vy = 0;
              person.landed = true;
            }
          }

          const kiteX = person.x;
          const kiteY = person.y;

          // the rope already supplies the kite's orientation, even while slack.
          // rotate so the kite-shape's bottom-right corner faces the hand.
          const angle =
            Math.atan2(handY - kiteY, handX - kiteX) * RADIANS_TO_DEGREES -
            KITE_ROTATION_OFFSET_DEGREES;
          person.kite.style.transform = `translate(${kiteX - KITE_HALF_SIZE}px, ${kiteY - KITE_HALF_SIZE}px) rotateZ(${angle}deg)`;

          // The person, kite, and rope share this group's depth. Rotate the
          // kite's bottom-right anchor into the group's 2D coordinate space.
          const anchorAngle = angle / RADIANS_TO_DEGREES;
          const anchorOffset = KITE_HALF_SIZE - 2;
          const ropeEndX =
            kiteX +
            anchorOffset * Math.cos(anchorAngle) -
            anchorOffset * Math.sin(anchorAngle);
          const ropeEndY =
            kiteY +
            anchorOffset * Math.sin(anchorAngle) +
            anchorOffset * Math.cos(anchorAngle);
          const ropeDistance = Math.hypot(person.x - handX, person.y - handY);
          const slack = Math.max(0, person.ropeLength - ropeDistance);
          const chord = Math.hypot(ropeEndX - handX, ropeEndY - handY);
          const sag = Math.min(
            chord * 0.45,
            ROPE_SLACK_OFFSET + slack * ROPE_SLACK_FACTOR
          );

          if (RENDER_KITE_ROPES) {
            const ropeAngle = Math.atan2(
              ropeEndY - handY,
              ropeEndX - handX
            );
            const localSagX = Math.sin(ropeAngle) * sag;
            const localSagY = Math.cos(ropeAngle) * sag;
            person.ropeLayer.style.transform = `rotate(${ropeAngle}rad)`;
            person.rope.setAttribute(
              "d",
              `M ${ROPE_LAYER_PADDING} ${ROPE_LAYER_PADDING} ` +
              `Q ${ROPE_LAYER_PADDING + chord / 2 + localSagX} ` +
              `${ROPE_LAYER_PADDING + localSagY} ` +
              `${ROPE_LAYER_PADDING + chord} ${ROPE_LAYER_PADDING}`
            );
          }
        });
      };
      requestAnimationFrame(draw);

    
    </script>
